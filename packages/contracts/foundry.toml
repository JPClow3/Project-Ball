[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
celo = "${CELO_MAINNET_RPC_URL}"
celo_sepolia = "${CELO_SEPOLIA_RPC_URL}"

[etherscan]
celo = { key = "${ETHERSCAN_API_KEY}", url = "https://api.celoscan.io/api", chain = 42220 }
celo_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.celoscan.io/api", chain = 11142220 }

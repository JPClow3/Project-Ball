name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web and Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck shared
        run: pnpm --filter @project-ball/shared check

      - name: Typecheck web
        run: pnpm --filter @project-ball/web check

      - name: Unit tests
        run: pnpm --filter @project-ball/web test

      - name: Build web
        run: pnpm --filter @project-ball/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @project-ball/web exec playwright install --with-deps chromium

      - name: Mobile E2E
        run: pnpm --filter @project-ball/web test:e2e

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std

      - name: Format
        run: forge fmt --check

      - name: Test
        run: forge test -vvv

      - name: Coverage
        run: |
          COVERAGE_OUTPUT=$(forge coverage --report summary --exclude-tests --skip script)
          echo "$COVERAGE_OUTPUT"
          # Enforce 90% line coverage for production contracts.
          LINE_COV=$(echo "$COVERAGE_OUTPUT" | grep "Total" | grep -oP '\d+\.\d+(?=%)' | head -1)
          if [ -z "$LINE_COV" ]; then
            echo "Could not parse line coverage from forge coverage output."
            exit 1
          fi
          if [ $(echo "$LINE_COV < 90.0" | bc) -eq 1 ]; then
            echo "Coverage $LINE_COV% is below 90% threshold!"
            exit 1
          fi
